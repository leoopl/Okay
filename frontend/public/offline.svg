  <!-- WiFi waves (broken) -->
  <path d="M155 275 Q200 255 245 275" stroke="#6B7280" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M170 295 Q200 280 230 295" stroke="#6B7280" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="200" cy="313" r="5" fill="#6B7280" opacity="0.5"/>

  <!-- Text label -->
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#374151" font-weight="600">Sem conexão</text>
</svg>
