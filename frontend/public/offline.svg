<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#FBE5A8" opacity="0.4"/>

  <!-- Cloud shape -->
  <ellipse cx="200" cy="170" rx="100" ry="55" fill="#E8D48A"/>
  <circle cx="145" cy="185" r="40" fill="#E8D48A"/>
  <circle cx="255" cy="185" r="35" fill="#E8D48A"/>

  <!-- Slash line through cloud (offline indicator) -->
